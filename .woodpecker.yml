# .woodpecker.yml
# Läuft auf dem Server direkt (Woodpecker local backend).
# Bei jedem Push: synct Website + Tools, baut & startet geänderte Tools.

when:
  branch: [main]
  event: [push]

pipeline:
  deploy:
    commands:
      - |
        set -e
        echo "== 1. Website nach /var/www/wiki =="
        sudo mkdir -p /var/www/wiki
        sudo chcon -R -t httpd_sys_content_t /var/www/wiki 2>/dev/null || true
        # Root-Webdateien (index.htm, style.css, Bilder, ...)
        sudo rsync -a index.htm index.html style.css *.jpg *.jpeg *.png *.svg 2>/dev/null /var/www/wiki/ || true
        # wiki/-Ordner (Inhalt wird über Root-Dateien gelegt)
        sudo rsync -a --delete wiki/ /var/www/wiki/
        sudo chcon -R -t httpd_sys_content_t /var/www/wiki 2>/dev/null || true

        echo "== 2. Tools nach ~/repo/tools =="
        rsync -a --delete tools/ ~/repo/tools/

        echo "== 3. Geänderte Tools deployen =="
        # Bei erstem Commit: keine Vorgeschichte -> alle bauen
        if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "tools/"; then
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
        else
          CHANGED="tools/"
        fi

        for lang in python rust nim go cpp ruby julia r d zig c; do
          for dir in tools/$lang/*/; do
            [ -d "$dir" ] || continue
            tool=$(basename "$dir")
            if echo "$CHANGED" | grep -q "tools/$lang/$tool/"; then
              echo ">> Deploy $tool ($lang)"
              /usr/local/bin/run-tool "$tool" "$lang" || echo ">> FEHLER bei $tool"
            fi
          done
        done

        echo "== Deploy abgeschlossen =="
