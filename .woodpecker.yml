# .woodpecker.yml

when:
  branch: [main]
  event: [push]

steps:
  deploy:
    image: bash
    commands:
      - |
        set -e
        echo "== 1. Statische Website nach /var/www/wiki =="
        sudo mkdir -p /var/www/wiki
        sudo rsync -a index.htm style.css background_paper.jpg /var/www/wiki/ 2>/dev/null || true
        sudo rsync -a wiki/ /var/www/wiki/ 2>/dev/null || true
        sudo chcon -R -t httpd_sys_content_t /var/www/wiki 2>/dev/null || true

        echo "== 2. Tools deployen =="
        DEPLOY=/home/iusearchbtw/repo
        sudo mkdir -p "$DEPLOY/tools" "$DEPLOY/run" "$DEPLOY/logs"
        sudo rsync -a --delete tools/ "$DEPLOY/tools/"

        echo "== 3. Alle Tools bauen =="
        for lang in python rust nim go cpp ruby julia r d zig c; do
          for dir in tools/$lang/*/; do
            [ -d "$dir" ] || continue
            tool=$(basename "$dir")
            echo ">> Deploy $tool ($lang)"
            sudo /usr/local/bin/run-tool "$tool" "$lang" || echo ">> FEHLER bei $tool"
          done
        done

        echo "== Deploy abgeschlossen =="
